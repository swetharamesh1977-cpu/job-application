!DOCTYPE html> <html> <head> <title>Job Portal Registration</title> <style> body{ font-family: Arial, sans-serif; background:lightyellow; } .container{ width:450px; margin:30px auto; background:lightpink; padding:20px; border-radius:10px; box-shadow:0 0 10px gray; } h2{ text-align:center; color:darkblue; } label{ font-weight:bold; } input,select,textarea{ width:95%; padding:8px; margin:8px 0; } input[type="radio"]{ width:auto; } .btn{ background:purple; color:white; border:none; padding:10px; cursor:pointer; } .btn:hover{ background:green; } </style> </head> <body> <div class="container"> <h2>Job Portal Registration</h2> <form onsubmit="return validateForm()"> <label>Full Name</label> <input type="text" id="name"> <label>Email</label> <input type="text" id="email"> <label>Date of Birth</label> <input type="date" id="dob"> <label>Mobile Number</label> <input type="text" id="mobile"> <label>Password</label> <input type="password" id="password"> <label>Confirm Password</label> <input type="password" id="confirm"> <label>Gender</label><br> <input type="radio" name="gender" value="Male"> Male <input type="radio" name="gender" value="Female"> Female <br><br> <label>Experience Level</label> <select id="experience"> <option value="">-- Select Experience --</option> <option value="entry">Entry Level (0-2 years)</option> <option value="mid">Mid Level (2-5 years)</option> <option value="senior">Senior Level (5+ years)</option> </select> <label>Qualification</label> <select id="qualification"> <option value="">Select</option> <option>B.E</option> <option>B.Tech</option> <option>B.Sc</option> <option>MCA</option> <option>M.Tech</option> </select> <label>Skills</label> <textarea id="skills"></textarea> <label>Resume</label> <input type="file" id="resume"> <br><br> <input type="submit" value="Register" class="btn"> </form> </div> <script> function validateForm() { var name=document.getElementById("name").value.trim(); var email=document.getElementById("email").value.trim(); var dob=document.getElementById("dob").value; var mobile=document.getElementById("mobile").value.trim(); var password=document.getElementById("password").value; var confirm=document.getElementById("confirm").value; var experience=document.getElementById("experience").value; var qualification=document.getElementById("qualification").value; var skills=document.getElementById("skills").value.trim(); var resume=document.getElementById("resume").value; var namePattern=/^[A-Za-z ]+$/; var emailPattern=/^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$/; var mobilePattern=/^[6-9]\d{9}$/; var errors=[]; if(name=="") errors.push("• Enter your full name"); else if(!namePattern.test(name)) errors.push("• Name should contain only letters"); if(email=="") errors.push("• Enter your email"); else if(!emailPattern.test(email)) errors.push("• Invalid email format"); if(dob=="") errors.push("• Select your date of birth"); if(mobile=="") errors.push("• Enter your mobile number"); else if(!mobilePattern.test(mobile)) errors.push("• Enter a valid 10-digit mobile number"); if(password=="") errors.push("• Enter password"); else if(password.length<6) errors.push("• Password must contain at least 6 characters"); if(confirm=="") errors.push("• Confirm your password"); else if(password!=confirm) errors.push("• Passwords do not match"); // Gender var gender=document.getElementsByName("gender"); var checked=false; for(var i=0;i<gender.length;i++) { if(gender[i].checked) { checked=true; break; } } if(!checked) errors.push("• Select gender"); if(experience=="") errors.push("• Select experience level"); if(qualification=="") errors.push("• Select qualification"); if(skills=="") errors.push("• Enter your skills"); if(resume=="") errors.push("• Upload your resume"); if(errors.length>0) { alert("Please correct the following errors:\n\n" + errors.join("\n")); return false; } alert("Registration Successful!"); return true; } </script> </body> </html>
